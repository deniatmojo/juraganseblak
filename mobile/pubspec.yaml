name: juragan_seblak_app
description: Aplikasi Android ERP & POS Juragan Seblak.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.20.2
  http: ^1.2.2
  http_parser: ^4.1.2
  share_plus: ^11.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  geolocator: ^13.0.2
  qr_flutter: ^4.1.0
  permission_handler: ^11.3.1
  pdf: ^3.11.3
  printing: ^5.14.2
  image_picker: ^1.2.0
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg

# Logo aplikasi (lingkaran cabai merah bertanduk "JURAGAN") di atas latar cream
# senada website — jalankan: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.jpg"
  adaptive_icon_background: "#FAF3EC"
  adaptive_icon_foreground: "assets/logo.jpg"
